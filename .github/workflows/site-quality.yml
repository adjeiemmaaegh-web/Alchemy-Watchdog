name: Alchemy static site quality
on:
  push:
    branches: [improve/**]
  pull_request:
    paths:
      - '**.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/site-quality.yml'
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          for file in assets/*.js; do node --check "$file"; done
          node --check tests/site.test.mjs
      - name: Built-in site regression suite
        run: node --test tests/site.test.mjs
      - name: Install headless browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser behavior and responsive visual check
        run: |
          mkdir -p artifacts
          node tests/browser.test.mjs
      - name: Store browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-browser-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
